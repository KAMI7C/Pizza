{% extends "base.html" %}
{% block title %}Оформление{% endblock %}
{% block content %}
<h1>Оформление заказа</h1>
<p class="muted">Итого: <strong>{{ cart.total }} BYN</strong></p>
<form method="post" class="stack-form">{% csrf_token %}
  {% for field in form %}
    <div class="field">
      {{ field.label_tag }}{{ field }}{{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit" class="btn">Подтвердить заказ</button>
</form>
{% endblock %}
