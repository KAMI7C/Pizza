{% extends "base.html" %}
{% load static %}
{% block title %}Конструктор пиццы{% endblock %}
{% block content %}
<h1>Собрать свою пиццу</h1>
<p class="muted">Нажмите на четверть с «+», выберите ингредиент.</p>
<div id="constructor-content">
  {% include "shop/_constructor_content.html" %}
</div>

<script>
  (() => {
    const root = document.getElementById("constructor-content");
    if (!root) return;

    const fragmentUrl = "{% url 'shop:constructor_fragment' %}";

    async function loadFragment(quarter = 1) {
      const res = await fetch(`${fragmentUrl}?quarter=${quarter}`, {
        headers: { "X-Requested-With": "XMLHttpRequest" },
      });
      if (!res.ok) return;
      root.innerHTML = await res.text();
    }

    root.addEventListener("click", async (event) => {
      const link = event.target.closest(".js-quarter-link");
      if (!link) return;
      event.preventDefault();
      const quarter = Number(link.dataset.quarter || 1);
      await loadFragment(quarter);
    });

    root.addEventListener("submit", async (event) => {
      const form = event.target.closest(".js-async-constructor-form");
      if (!form) return;
      event.preventDefault();

      const formData = new FormData(form);
      const action = form.getAttribute("action");
      const res = await fetch(action, {
        method: "POST",
        headers: { "X-Requested-With": "XMLHttpRequest" },
        body: formData,
      });

      const contentType = res.headers.get("content-type") || "";
      if (contentType.includes("application/json")) {
        const data = await res.json();
        if (data.redirect_url) {
          window.location.href = data.redirect_url;
        }
        return;
      }

      if (res.ok) {
        root.innerHTML = await res.text();
      }
    });
  })();
</script>
{% endblock %}
