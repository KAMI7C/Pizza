{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" class="stack-form">{% csrf_token %}
  {% for field in form %}
    <div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
  {% endfor %}
  <button type="submit" class="btn">Создать аккаунт</button>
</form>
<p><a href="{% url 'shop:login' %}">Уже есть аккаунт</a></p>
{% endblock %}
